<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Watchlist -- DividendIQ Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg"/>
  <link rel="stylesheet" href="./styles.css"/>
  <style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;}</style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="page">
  <div class="hero">
    <div class="hero-label">WATCHLIST</div>
    <div class="hero-title" style="font-size:20px;">Track your dividend picks</div>
    <div class="hero-sub" style="font-size:12px;">Add tickers, get live prices, and run AI analysis on any stock.</div>
  </div>

  <div class="page-content">

    <!-- Add ticker -->
    <div class="card" style="margin-top:14px;">
      <div style="display:flex;gap:8px;">
        <input type="text" id="watch-input" class="input" placeholder="Add ticker (e.g. ARCC, O, CVX)" maxlength="8" style="flex:1;text-transform:uppercase;"/>
        <button class="btn primary" onclick="addToWatchlist()" style="flex-shrink:0;">Add</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;">
        <div style="font-size:10px;color:var(--muted);width:100%;margin-bottom:2px;">Quick add:</div>
        <button class="quick-prompt" onclick="quickAdd('JEPI')">JEPI</button>
        <button class="quick-prompt" onclick="quickAdd('ARCC')">ARCC</button>
        <button class="quick-prompt" onclick="quickAdd('O')">O</button>
        <button class="quick-prompt" onclick="quickAdd('MAIN')">MAIN</button>
        <button class="quick-prompt" onclick="quickAdd('SCHD')">SCHD</button>
        <button class="quick-prompt" onclick="quickAdd('CVX')">CVX</button>
        <button class="quick-prompt" onclick="quickAdd('T')">T</button>
        <button class="quick-prompt" onclick="quickAdd('AGNC')">AGNC</button>
      </div>
    </div>

    <!-- Live prices strip -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;">
      <div class="section-label" style="margin:0;">Your watchlist</div>
      <button class="btn ghost sm" id="refresh-btn" onclick="refreshAll()">Refresh prices</button>
    </div>

    <div id="watchlist-items">
      <div class="loading-center"><div class="spinner" style="width:24px;height:24px;"></div><div class="loading-title" style="font-size:13px;">Loading...</div></div>
    </div>

    <!-- AI Analysis panel -->
    <div id="ai-panel" class="hidden" style="margin-top:12px;">
      <div class="section-label">AI Analysis</div>
      <div id="ai-result"></div>
    </div>

    <div id="disclaimer-el"></div>
    <div style="height:80px;"></div>
  </div>
</div>

<div id="bottom-nav-placeholder"></div>

<script src="./app.js"></script>
<script>
const DQ = window.DQ;
let watchlist = DQ.State.get('watchlist', [
  {ticker:'JEPI', note:'Covered call ETF, 8.5% yield'},
  {ticker:'ARCC', note:'Best-in-class BDC, 9.5% yield'},
  {ticker:'O',    note:'Monthly Dividend Company, 5.5%'},
  {ticker:'SCHD', note:'Dividend growth ETF, 3.5%'},
]);
let prices = {};

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('nav-placeholder').appendChild(DQ.buildNav(''));
  document.getElementById('bottom-nav-placeholder').appendChild(DQ.buildBottomNav(''));
  document.getElementById('watch-input').addEventListener('keydown', e => { if(e.key==='Enter') addToWatchlist(); });
  document.getElementById('watch-input').addEventListener('input', e => e.target.value = e.target.value.toUpperCase());
  document.getElementById('disclaimer-el').innerHTML = DQ.disclaimerHTML();
  renderWatchlist();
  refreshAll();
});

function quickAdd(ticker) {
  document.getElementById('watch-input').value = ticker;
  addToWatchlist();
}

function addToWatchlist() {
  const ticker = document.getElementById('watch-input').value.trim().toUpperCase();
  if (!ticker) return;
  if (watchlist.find(w => w.ticker === ticker)) { DQ.showToast(ticker + ' already in watchlist', 'error'); return; }
  watchlist.push({ ticker, note:'' });
  DQ.State.set('watchlist', watchlist);
  document.getElementById('watch-input').value = '';
  renderWatchlist();
  fetchPrice(ticker);
}

function removeFromWatchlist(ticker) {
  watchlist = watchlist.filter(w => w.ticker !== ticker);
  DQ.State.set('watchlist', watchlist);
  delete prices[ticker];
  renderWatchlist();
  DQ.showToast(ticker + ' removed');
}

function renderWatchlist() {
  const el = document.getElementById('watchlist-items');
  if (!watchlist.length) {
    el.innerHTML = '<div class="card text-center"><div style="font-size:13px;color:var(--muted);">Your watchlist is empty. Add tickers above.</div></div>';
    return;
  }
  el.innerHTML = '';
  watchlist.forEach(w => {
    const q = prices[w.ticker] || {};
    const pctColor = (q.pct||0) >= 0 ? 'var(--green)' : 'var(--red)';
    const item = document.createElement('div');
    item.className = 'card';
    item.style.cssText = 'padding:12px 14px;margin-bottom:8px;';
    item.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <div style="flex:1;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap;">
            <div style="font-size:18px;font-weight:800;color:var(--navy);">${w.ticker}</div>
            ${q.price ? `<span style="font-size:15px;font-weight:700;color:var(--text);">$${DQ.sfx(q.price,2)}</span>` : '<span class="skeleton" style="width:60px;height:18px;display:inline-block;"></span>'}
            ${q.pct !== undefined ? `<span class="tag ${q.pct>=0?'green':'red'}">${q.pct>=0?'+':''}${DQ.sfx(q.pct,2)}%</span>` : ''}
          </div>
          ${w.note ? `<div style="font-size:11px;color:var(--muted);">${w.note}</div>` : ''}
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0;">
          <button class="btn ghost sm" onclick="analyzeStock('${w.ticker}')">Analyze</button>
          <button onclick="removeFromWatchlist('${w.ticker}')" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:11px;padding:4px;">Remove</button>
        </div>
      </div>`;
    el.appendChild(item);
  });
}

async function fetchPrice(ticker) {
  const q = await DQ.fetchQuote(ticker);
  if (q.ok) { prices[ticker] = q; renderWatchlist(); }
}

async function refreshAll() {
  const btn = document.getElementById('refresh-btn');
  btn.textContent = 'Refreshing...'; btn.disabled = true;
  await Promise.all(watchlist.map(w => fetchPrice(w.ticker)));
  btn.textContent = 'Refresh prices'; btn.disabled = false;
  DQ.showToast('Prices updated');
}

async function analyzeStock(ticker) {
  const panel = document.getElementById('ai-panel');
  const result = document.getElementById('ai-result');
  panel.classList.remove('hidden');
  result.innerHTML = `<div class="loading-center"><div class="spinner" style="width:24px;height:24px;"></div><div class="loading-title" style="font-size:13px;">Analyzing ${ticker}...</div></div>`;
  panel.scrollIntoView({behavior:'smooth'});

  const q = prices[ticker] || {};
  const profile = DQ.State.profile();

  try {
    const reply = await DQ.callClaude([{role:'user', content:
      `Analyze ${ticker} for a retirement income investor. Current price: $${DQ.sfx(q.price||0,2)}, day change: ${DQ.sfx(q.pct||0,2)}%.
      Investor profile: ${profile.name}, age ${profile.age}, income goal $${profile.income_goal}/mo, risk: ${profile.risk}.
      Cover: 1) Dividend safety and yield quality, 2) Is this appropriate for retirement income at this investor's risk level,
      3) Buy/Hold/Avoid recommendation with specific reasoning, 4) Best sleeve fit (High-Dividend/Dividend Growth/ETF Income/BDC/REIT/Bond).
      Be specific. End with: For informational purposes only -- not personalized financial advice.`
    }], DQ.AI_SYSTEM, 600);
    result.innerHTML = `
      <div class="card" style="border-left:3px solid var(--blue);">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <div style="font-size:16px;font-weight:800;color:var(--navy);">${ticker}</div>
          ${q.price?`<span style="font-weight:700;">$${DQ.sfx(q.price,2)}</span>`:''}
          ${q.pct!==undefined?`<span class="tag ${q.pct>=0?'green':'red'}">${q.pct>=0?'+':''}${DQ.sfx(q.pct,2)}%</span>`:''}
        </div>
        <div style="font-size:13px;color:var(--text);line-height:1.8;white-space:pre-wrap;">${reply}</div>
      </div>`;
  } catch(e) {
    result.innerHTML = `<div class="card red"><div style="font-size:13px;color:var(--red);">Analysis failed: ${e.message}</div></div>`;
  }
}
</script>
</body>
</html>
